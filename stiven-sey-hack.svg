<svg width="400" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark Matrix Background -->
  <rect width="400" height="200" fill="#0f0f0f" rx="10"/>
  
  <!-- Green Binary Code Rain -->
  <text x="20" y="30" font-family="monospace" font-size="12" fill="#00ff00" opacity="0.3">01001110</text>
  <text x="80" y="60" font-family="monospace" font-size="12" fill="#00ff00" opacity="0.3">01010100</text>
  <text x="140" y="90" font-family="monospace" font-size="12" fill="#00ff00" opacity="0.3">01001001</text>
  <text x="200" y="120" font-family="monospace" font-size="12" fill="#00ff00" opacity="0.3">01010110</text>
  <text x="260" y="150" font-family="monospace" font-size="12" fill="#00ff00" opacity="0.3">01000101</text>
  <text x="320" y="180" font-family="monospace" font-size="12" fill="#00ff00" opacity="0.3">01001110</text>
  
  <!-- Skull Icon (Hacker Symbol) -->
  <circle cx="80" cy="100" r="15" fill="#1a1a1a" stroke="#00ff00" stroke-width="2"/>
  <circle cx="70" cy="95" r="2" fill="#00ff00"/>
  <circle cx="90" cy="95" r="2" fill="#00ff00"/>
  <path d="M70 110 Q80 120,90 110" stroke="#00ff00" stroke-width="2" fill="none"/>
  
  <!-- Terminal Window -->
  <rect x="250" y="40" width="120" height="70" fill="#1a1a1a" stroke="#00ff00" stroke-width="2" rx="5"/>
  <line x1="250" y1="50" x2="370" y2="50" stroke="#00ff00" stroke-width="1"/>
  <circle cx="265" cy="45" r="3" fill="#ff0000"/>
  <circle cx="280" cy="45" r="3" fill="#ffff00"/>
  <circle cx="295" cy="45" r="3" fill="#00ff00"/>
  <text x="260" y="70" font-family="monospace" font-size="8" fill="#00ff00">C:\hack&gt;</text>
  <text x="260" y="90" font-family="monospace" font-size="8" fill="#00ff00">access granted</text>
  
  <!-- Main Text - Hacker Font -->
  <text x="120" y="60" font-family="'Courier New', monospace" font-size="36" font-weight="bold" fill="#00ff00" letter-spacing="4">STIVEN</text>
  
  <!-- SEY with Glitch Effect -->
  <text x="160" y="130" font-family="'Courier New', monospace" font-size="48" font-weight="bold" fill="#00ff00" letter-spacing="2">SEY</text>
  <text x="158" y="128" font-family="'Courier New', monospace" font-size="48" font-weight="bold" fill="#ff0000" opacity="0.5" letter-spacing="2">SEY</text>
  
  <!-- Hacker Tagline -->
  <text x="200" y="180" font-family="monospace" font-size="10" fill="#00ff00" opacity="0.6">root@stiven-sey:~#</text>
  
  <!-- Animated Cursor -->
  <rect x="290" y="180" width="10" height="2" fill="#00ff00">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>